<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVIBE | 管理登入</title>
    <link rel="stylesheet" href="assets/css/app.css?v=20260824-2">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <a class="login-brand" href="index.html">LIVIBE</a>
            <p class="eyebrow">Administrator Access</p>
            <h1 id="login-title">管理者登入</h1>
            <p class="login-copy">登入最高管理員後，即可刪除觀眾留言並調整場館視野分類。</p>

            <form id="admin-login-form" class="login-form">
                <label class="login-field" for="login-username">
                    <span>管理帳號</span>
                    <input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
                </label>
                <label class="login-field" for="login-password">
                    <span>密碼</span>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </label>
                <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
                <div class="login-actions">
                    <button class="primary-button" type="submit">登入管理後台</button>
                    <a class="secondary-button" href="index.html">返回網站</a>
                </div>
            </form>

            <p class="password-hint">登入狀態只保留於目前分頁工作階段，關閉分頁後會自動登出。</p>
        </section>
    </main>

    <script src="assets/js/core.js?v=20261015-1"></script>
</body>
</html>
