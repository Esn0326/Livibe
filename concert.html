<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVIBE | 演唱會詳情</title>
    <link rel="stylesheet" href="assets/css/app.css?v=20260821-10">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-box">LIVIBE</a>
        <div class="nav-links">
            <a href="index.html">回到首頁</a>
            <a href="venues.html">場館視野</a>
            <a id="nav-map-link" href="#venue-section">本場座位圖</a>
            <a href="#discussion-section">討論</a>
        </div>
        <a class="nav-auth-link" data-auth-link href="login.html">管理登入</a>
    </nav>

    <main id="detail-root" class="detail-page">
        <section class="detail-hero">
            <div class="detail-poster" id="detail-poster" aria-hidden="true"></div>
            <div class="detail-main">
                <div class="detail-meta">
                    <span id="tag-display" class="type-pill">LOADING</span>
                    <span id="status-display">載入中</span>
                </div>
                <h1 id="detail-title">載入演出資料中</h1>
                <p id="detail-artist" class="detail-artist"></p>

                <div class="rating-row">
                    <div class="score-box">
                        <span id="rating-score">--</span>
                        <small>LIVIBE 評分</small>
                    </div>
                    <div class="score-box subtle">
                        <span id="volume-score">-- dB</span>
                        <small>現場震撼度</small>
                    </div>
                    <button id="watchlist-button" class="secondary-button" type="button">加入片單</button>
                </div>

                <div class="info-grid">
                    <div>
                        <span>日期</span>
                        <strong id="display-date">--</strong>
                    </div>
                    <div>
                        <span>場館</span>
                        <strong id="display-venue">--</strong>
                    </div>
                    <div>
                        <span>主辦</span>
                        <strong id="display-organizer">--</strong>
                    </div>
                </div>

                <div id="session-container" class="session-box">
                    <label for="session-dropdown">選擇場次</label>
                    <select id="session-dropdown"></select>
                </div>
            </div>
        </section>

        <section class="detail-layout">
            <article class="content-stack">
                <section class="panel">
                    <div class="panel-header">
                        <h2>演出資訊</h2>
                    </div>
                    <p id="summary-text" class="summary-text"></p>
                    <div id="artist-list" class="artist-list"></div>
                </section>

               <section class="panel" id="venue-section">
                    <div class="panel-header">
                        <div>
                            <p class="eyebrow">Seat View</p>
                            <h2>本場座位視野</h2>
                        </div>
                        <a class="text-link" href="venues.html">查看完整場館視野庫 →</a>
                    </div>
                    <div id="concert-config-admin" class="concert-config-admin"></div>
                    <p class="venue-help">點選座位圖上的區域，查看該區實拍視角與觀眾評價。座位配置取自 LIVIBE 場館資料庫，實際配置仍以各場次主辦單位公告為準。</p>
                    <div class="seat-view-layout">
                        <div>
                            <div class="diagram-toolbar">
                                <span id="diagram-venue-name">場館座位配置</span>
                                <div class="map-tools" data-map-tools>
                                    <button type="button" data-map-action="hide-empty">隱藏無照片區</button>
                                    <button type="button" data-map-action="out" aria-label="縮小座位圖">−</button>
                                    <button type="button" data-map-action="reset">重設</button>
                                    <button type="button" data-map-action="in" aria-label="放大座位圖">＋</button>
                                </div>
                            </div>
                            <div class="arena-map-viewport">
                                <svg class="stage-diagram taipei-arena-diagram" id="stage-svg-diagram" viewBox="0 0 2550 3488" preserveAspectRatio="xMidYMid meet" aria-label="可點選的台北小巨蛋座位配置圖"></svg>
                            </div>
                        </div>
                        <aside class="seat-result" aria-live="polite">
                            <div id="seat-view-photo" class="seat-view-photo"><span>SELECT A SECTION</span></div>
                            <div class="seat-result-heading">
                                <div>
                                    <small id="view-location">請先選擇區域</small>
                                    <h3 id="view-title">點選圖上的座位區</h3>
                                </div>
                                <strong id="view-score">--</strong>
                            </div>
                            <p id="view-description">選擇區域後，這裡會顯示座位實拍視角、距離感與可能的遮擋資訊。</p>
                            <div id="view-tags" class="view-tags"></div>
                            <div class="seat-actions">
                                <button type="button" id="view-more-button" class="primary-button">查看此區視野</button>
                                <a id="display-map" class="secondary-link" href="#" target="_blank" rel="noopener">場館交通</a>
                            </div>
                        </aside>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>相關新聞</h2>
                    </div>
                    <div id="news-list" class="news-list"></div>
                </section>
            </article>

            <aside class="content-stack">
                <section class="panel" id="discussion-section">
                    <div class="panel-header">
                        <h2>觀眾討論</h2>
                        <div id="discussion-role-control"></div>
                    </div>
                    <form id="review-form" class="review-form">
                        <label>
                            <span>你的評分</span>
                            <select id="review-rating">
                                <option value="10">10 - 必看神場</option>
                                <option value="9">9 - 非常推薦</option>
                                <option value="8" selected>8 - 值得進場</option>
                                <option value="7">7 - 表現穩定</option>
                                <option value="6">6 - 普通</option>
                            </select>
                        </label>
                        <label>
                            <span>留言</span>
                            <textarea id="review-text" rows="4" placeholder="分享音響、視線、入場動線或演出亮點"></textarea>
                        </label>
                        <button type="submit" class="primary-button">送出討論</button>
                    </form>
                    <div id="discussion-list" class="discussion-list"></div>
                </section>
            </aside>
        </section>
    </main>

    <script src="assets/data/site-data.js?v=20260821-3"></script>
    <script src="assets/js/venue-maps.js?v=20260821-10"></script>
    <script src="assets/js/core.js?v=20260821-10"></script>
    <script src="assets/js/concert.js?v=20260821-10"></script>
</body>
</html>
